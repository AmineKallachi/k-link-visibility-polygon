  .note { font: 11px Archivo, 'Helvetica Neue', Arial, sans-serif; fill: var(--fig-ink, #1e2a35); paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .math { font: italic 13px Literata, Georgia, serif; fill: var(--fig-ink, #1e2a35); paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .reflex { fill: none; stroke: var(--fig-ink, #1e2a35); stroke-width: 1.2; }
